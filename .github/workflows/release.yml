name: Release

# Build native installers for macOS, Windows and Linux whenever a version
# tag (e.g. v0.1.0) is pushed, and publish them to a GitHub Release.
on:
  push:
    tags:
      - "v*"
  # Allow manual runs from the Actions tab for testing (no release published).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon + Intel in one universal .dmg / .app
          - platform: macos-latest
            target: universal-apple-darwin
            args: "--target universal-apple-darwin"
          # Windows .exe (NSIS) + .msi
          - platform: windows-latest
            target: ""
            args: ""
          # Linux .AppImage + .deb + .rpm
          - platform: ubuntu-22.04
            target: ""
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS universal binary needs both architectures.
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.platform }}-${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # --- Optional code signing (leave unset for unsigned builds) ---
          # macOS:
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          # Creates/updates a release for the pushed tag and uploads the bundles.
          tagName: ${{ github.ref_name }}
          releaseName: "ClearCompare ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install ClearCompare for your platform."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
